# ============================================================================
# ServiceMonitor — Prometheus scrapes the API's /metrics (D32)
# ============================================================================
# Requires the ServiceMonitor CRD, installed by kube-prometheus-stack: install
# the chart BEFORE `kubectl apply -k` (docs/KUBERNETES.md, "Observability").
# Prometheus reaches /metrics through the Service, inside the cluster; the
# Ingress does not publish it (D32).
# ============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: geotracker-api
  namespace: geotracker
  labels:
    app: geotracker-api
spec:
  selector:
    matchLabels:
      app: geotracker-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
