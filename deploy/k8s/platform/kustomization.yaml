# ============================================================================
# platform/kustomization.yaml — geoTracker's pieces of the observability stack
# ============================================================================
# The stack itself (Prometheus, Grafana, kube-state-metrics) is installed with
# Helm from kube-prometheus-stack/ (D31). This kustomization holds what is
# OURS and is applied together with the app (overlays include it):
#  - the API ServiceMonitor (needs the chart's CRDs: install the chart first);
#  - the geoTracker dashboards, one ConfigMap per JSON file, picked up by the
#    Grafana sidecar (label grafana_dashboard=1) into the "geoTracker" folder.
# No global `namespace:` here: each object declares its own.
# ============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - servicemonitor-api.yaml

configMapGenerator:
  - name: grafana-dashboard-heatmap-trafico
    namespace: monitoring
    files:
      - grafana/dashboards/heatmap-trafico-slp.json
    options:
      # Fixed name: with a hash suffix every change would leave the previous
      # ConfigMap behind (apply does not prune) and Grafana would see the same
      # dashboard uid twice.
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: geoTracker
  # Alert rules (D40), picked up by the Grafana alerts sidecar (label grafana_alert=1).
  - name: grafana-alertas-etl
    namespace: monitoring
    files:
      - grafana/alerts/etl.yaml
    options:
      disableNameSuffixHash: true
      labels:
        grafana_alert: "1"
