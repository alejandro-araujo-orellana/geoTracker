# ============================================================================
# kube-prometheus-stack 93.3.0 — values COMMON to every environment (D31, D33)
# ============================================================================
# Platform, not app: installed with Helm (D31), not Kustomize (D20 covers the
# geoTracker apps). Each environment adds its own file on top:
#   local: values-local.yaml   (Grafana Alerting, no Alertmanager, small)
#   nube:  values-nube.yaml    (phase 2: Alertmanager on, Grafana sends to it)
#
# Install / upgrade (Helm from a container; nothing installed on the host) — see
# docs/KUBERNETES.md "Observabilidad":
#   helm upgrade --install kps oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack \
#     --version 93.3.0 -n monitoring --create-namespace \
#     -f deploy/k8s/platform/kube-prometheus-stack/values.yaml \
#     -f deploy/k8s/platform/kube-prometheus-stack/values-local.yaml
# ============================================================================

# Short resource names: kps-prometheus, kps-grafana, kps-kube-state-metrics...
fullnameOverride: kps

prometheus:
  prometheusSpec:
    # Pick up every ServiceMonitor / PodMonitor / PrometheusRule in the cluster,
    # not only the ones labelled with this Helm release. The geoTracker
    # ServiceMonitor lives in deploy/k8s/platform (Kustomize), not in this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Operational metrics only: the traffic history lives in TimescaleDB (D31).
    retention: 7d
    retentionSize: 4GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

grafana:
  # Pinned to the version the geoTracker dashboards were exported from (v2
  # dashboard format, file provisioning verified with 13.0.2). Same image as the
  # Compose Grafana. Bump on purpose, re-checking the dashboards.
  image:
    registry: docker.io
    repository: grafana/grafana-oss
    tag: "13.0.2"

  # Admin credentials from the Secret generated by the overlay (grafana.env, untracked).
  admin:
    existingSecret: grafana-secret
    userKey: GF_SECURITY_ADMIN_USER
    passwordKey: GF_SECURITY_ADMIN_PASSWORD

  # Password of the read-only DB role, interpolated into the datasource below by
  # Grafana itself (${GRAFANA_DB_PASSWORD}); it never appears in this file.
  envValueFrom:
    GRAFANA_DB_PASSWORD:
      secretKeyRef:
        name: grafana-secret
        key: GRAFANA_DB_PASSWORD

  # Users, preferences and alert state survive pod restarts. Dashboards and
  # datasources do not depend on it: they are provisioned from git.
  persistence:
    enabled: true
    size: 1Gi

  sidecar:
    dashboards:
      # ConfigMaps labelled grafana_dashboard=1 (any namespace) become dashboards;
      # the grafana_folder annotation picks the folder.
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

  # Business data (D31): TimescaleDB with the read-only role grafana_ro (D33).
  # Direct to the DB, not through PgBouncer (transaction pooling + prepared statements).
  # uid "timescaledb" is what the dashboards in platform/grafana/dashboards reference.
  additionalDataSources:
    - name: TimescaleDB
      uid: timescaledb
      type: grafana-postgresql-datasource
      url: geotracker-db.geotracker.svc.cluster.local:5432
      user: grafana_ro
      editable: false
      jsonData:
        database: vialidades_slp
        sslmode: disable
        postgresVersion: 1500
        timescaledb: true
        maxOpenConns: 5
      secureJsonData:
        password: ${GRAFANA_DB_PASSWORD}
