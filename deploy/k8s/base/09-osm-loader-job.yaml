# ============================================================================
# 09-osm-loader-job.yaml — Load the OSM road network (phase 2) into the DB
# ============================================================================
# Runs scripts/osmnx_loader.py ONCE: downloads the drive network of the study
# zone (src/zona.py) from OpenStreetMap and upserts it into dim_calles_osm and
# dim_calles_osm_vertices_pgr. Without it the predictor has no streets to
# infer over and /api/v1/rutas answers 503 ("La red vial no está cargada").
#
# Same pattern as the migrations Job (07): a Job, not part of the ETL cycle,
# because the network only changes every few months. The loader is idempotent
# (upsert by (u,v,k), removed edges marked activo = FALSE), so re-running it is
# safe. A completed Job is NOT re-run by `apply -k`; to refresh the network:
#   kubectl delete job geotracker-osm-loader -n geotracker
#   kubectl apply -k deploy/k8s/overlays/local
#
# Order: needs migrations >= 005. Applying everything at once is fine: the
# initContainer waits for the migrations Job to get there, so the (slow)
# download never starts against an empty schema. D29.
#
# Overpass: the public overpass-api.de refuses automated clients (it answers a
# "run your own instance" notice instead of JSON). So the osmnx cache lives in a
# PVC, seeded ONCE from the host ./cache (same bbox + osmnx version = cache hit).
# Seed it with a throwaway pod that mounts the PVC (see docs/KUBERNETES.md):
#   kubectl apply -f deploy/k8s/tools/sembrar-cache-osmnx.yaml
#   kubectl wait -n geotracker --for=condition=ready pod/sembrar-cache-osmnx
#   kubectl cp cache/. geotracker/sembrar-cache-osmnx:/cache
#   kubectl delete -f deploy/k8s/tools/sembrar-cache-osmnx.yaml
# A real refresh of the network needs an Overpass that accepts the load (own
# instance, or run the loader on the host and seed the new cache files).
# ============================================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: geotracker-osm-loader
  namespace: geotracker
spec:
  backoffLimit: 2            # each attempt re-downloads from Overpass; don't hammer it
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: esperar-migraciones
          image: geotracker-etl:latest
          imagePullPolicy: IfNotPresent
          # Polls schema_migrations every 5 s (max ~10 min) until version >= 005.
          command:
            - python
            - -c
            - |
              import os, sys, time
              from sqlalchemy import create_engine, text
              url = ("postgresql+psycopg2://{DB_USER}:{DB_PASSWORD}@{DB_HOST}:{DB_PORT}/{DB_NAME}"
                     .format(**os.environ))
              engine = create_engine(url)
              for _ in range(120):
                  try:
                      with engine.connect() as c:
                          v = c.execute(text("SELECT max(version) FROM schema_migrations")).scalar()
                      if v and v >= "005":
                          print(f"migraciones en {v}: listo"); sys.exit(0)
                  except Exception as e:
                      v = type(e).__name__
                  print(f"esperando migraciones (actual: {v})", flush=True)
                  time.sleep(5)
              sys.exit(1)
          envFrom: &envFrom
            - configMapRef:
                name: geotracker-config
          env: &env
            # Straight to Postgres, not through PgBouncer: a one-off bulk load in a
            # single long transaction gains nothing from transaction pooling.
            # (Cloud/CNPG overlay: patch to geotracker-db-rw.)
            - name: DB_HOST
              value: "geotracker-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geotracker-secret
                  key: DB_PASSWORD
            # scripts/config.py reads TOMTOM_API_KEY at import time (not used here).
            - name: TOMTOM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: geotracker-secret
                  key: TOMTOM_API_KEY
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      containers:
        - name: osm-loader
          image: geotracker-etl:latest
          imagePullPolicy: IfNotPresent
          # Run from /app (WORKDIR) like on the host, so osmnx caches in ./cache.
          command: ["python", "scripts/osmnx_loader.py"]
          envFrom: *envFrom
          env: *env
          volumeMounts:
            - name: cache-osmnx
              mountPath: /app/cache
          resources:
            # osmnx/geopandas build the whole graph in memory (~67k edges).
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
      volumes:
        - name: cache-osmnx
          persistentVolumeClaim:
            claimName: cache-osmnx
---
# osmnx cache (Overpass responses, ~120 MB). Persistent so the loader does not
# depend on the public Overpass server (see header).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cache-osmnx
  namespace: geotracker
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
