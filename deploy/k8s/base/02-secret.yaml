##
#  02-secret.yaml
##
#
#  A secret stores what is sensible and should not be in public access:
#  DB passwords and the TOMTOM_API_KEY (api service for the traffic/geografic parameters)
#
#  Secrets can be encrypted at rest in "etcd" (cluster DB), be restricted by RBAC, and will
#  not be printed on the kubectl logs by default. 
#
#  !!! This should not be stored in git!!!
#

apiVersion: v1
kind: Secret
metadata:
  name: geotracker-secret
  namespace: geotracker
type: Opaque
stringData:
  DB_PASSWORD: ""
  TOMTOM_API_KEY: ""

