# ============================================================================
# 08-ingress.yaml — The gateway from outside the cluster
# ============================================================================
# The API Service (file 05) is only accessible FROM WITHIN the cluster. The
# Ingress is what exposes the API to the outside world: it defines the domain,
# routing rules (which path maps to which Service), and is where TLS—as well
# as your required token-based access control—are configured.
#
# This requires an "Ingress Controller" to be installed in the cluster (e.g.,
# nginx-ingress, Traefik, etc.). k3d comes with Traefik by default, so it
# works out of the box in a local environment.
#
# YOUR ANTI-COMMERCIALIZATION CONTROL (per the TomTom/D8 requirements):
# Access is limited to "only your devices" by the X-API-Key token that the API
# itself validates (D26), over TLS in the cloud. There is no IP restriction
# (D49). With this, it is not an open service—keeping you within the bounds of
# the D8 requirements.
# ============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: geotracker-api
  namespace: geotracker
  # annotations: none needed locally. The cloud overlay (phase 2, D49) adds TLS
  # (cert-manager) and a per-client rate limit (Traefik rateLimit middleware),
  # and removes the /docs and /openapi.json paths below.
  #
  # Token-based access is NOT done here: the API validates the X-API-Key header
  # itself (D26), which is portable across ingress controllers.
spec:
  # Which Ingress controller handles this Ingress. Replaces the deprecated
  # "kubernetes.io/ingress.class" annotation. "traefik" is the IngressClass that
  # k3d/k3s installs; on AKS it will differ (e.g. nginx or
  # webapprouting.kubernetes.azure.com) and the cloud overlay must patch it.
  ingressClassName: traefik
  rules:
    # For local development without a real domain, you can either use a 
    # dummy hostname mapped in /etc/hosts file, or simply use 
    # port-forwarding (which is easier—see the guide).
    - host: geotracker.local
      http:
        # Only what clients need is published (D32): /api/v1 (token-protected) and the
        # interactive docs. /metrics and /health/* stay internal: Prometheus and the
        # kubelet reach them through the Service / pod, never through the Ingress.
        # A catch-all "/" would publish /metrics, which has no token.
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: geotracker-api
                port:
                  number: 80
          - path: /docs
            pathType: Exact
            backend:
              service:
                name: geotracker-api
                port:
                  number: 80
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: geotracker-api
                port:
                  number: 80
