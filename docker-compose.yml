# geoTracker — Docker Compose v2+ (probado con v5.1). Ver docs/DECISIONES.md D17.
# Credenciales: todas desde .env (DB_USER, DB_PASSWORD, DB_NAME, TOMTOM_API_KEY,
# GF_ADMIN_USER, GF_ADMIN_PASSWORD). Nada sensible en este archivo.
# Imágenes con versión fija: reconstruir o actualizar la BD/Grafana es una decisión
# explícita, no un efecto secundario de `docker compose up`.
#
# TODO APAGADO por defecto (D44): el sistema vigente es el cluster de Kubernetes (docs/KUBERNETES.md).
# Sin perfil, `docker compose up -d` no arranca nada. Perfiles:
#   compose          → BD + API (la BD de Compose quedó congelada en el corte del 2026-11-13, D29/D43)
#   etl-compose      → BD + ETL      (D29; suspender antes el CronJob del cluster)
#   grafana-compose  → BD + Grafana  (D35)
# Solo la BD (p. ej. para tests de integración): `docker compose --profile compose up -d --wait timescaledb`.

name: geotracker

services:
  timescaledb:
    # Imagen fija: PostgreSQL 15.2 + TimescaleDB 2.10.2 + PostGIS 3.3.2 + pgRouting 4.0.1.
    # `pg15-latest` hoy traería versiones incompatibles con los datos (D17).
    image: geotracker-timescaledb:pg15.2-ts2.10.2
    build:
      context: ./db
    container_name: trafico_db
    # DESACTIVADA por defecto (D44): la BD vigente es geotracker-db-0 en el cluster. El volumen
    # datos_postgres se conserva (histórico ya copiado al cluster, D43). En todos los perfiles porque
    # los demás servicios dependen de ella.
    profiles: ["compose", "etl-compose", "grafana-compose"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - red_trafico

  etl_worker:
    build: .
    container_name: etl_trafico
    # DESACTIVADO por defecto (D29): el ETL corre ahora como CronJob en Kubernetes.
    # Ambos usan la misma clave TomTom con pools consumo_api separados: correr los dos
    # excede la cuota. Solo arranca con `docker compose --profile etl-compose up -d`
    # (y entonces suspende el CronJob: `kubectl patch cronjob geotracker-etl -n geotracker
    # -p '{"spec":{"suspend":true}}'`).
    profiles: ["etl-compose"]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: timescaledb
      DB_PORT: "5432"
    # Sin montar el código: el contenedor corre la versión construida en la imagen (D17).
    networks:
      - red_trafico

  api:
    build: ./services/api
    container_name: geotracker_api
    # DESACTIVADA por defecto (D44): la API vigente es el Deployment geotracker-api del cluster
    # (`kubectl port-forward -n geotracker svc/geotracker-api 8000:80`). Usa el mismo puerto local.
    # Solo arranca con `docker compose --profile compose up -d`.
    profiles: ["compose"]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: timescaledb
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - red_trafico

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: grafana_bi
    # DESACTIVADO por defecto (D35): el Grafana vigente es el del cluster (D33,
    # `kubectl port-forward -n monitoring svc/kps-grafana 3001:80`). Este lee la BD de Compose,
    # sin datos nuevos desde el corte de D29. Solo arranca con
    # `docker compose --profile grafana-compose up -d grafana`. El volumen grafana_data se conserva.
    profiles: ["grafana-compose"]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    dns:
      - 8.8.8.8
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      # Solo aplica al crear la BD interna de Grafana; después se cambia desde la UI.
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
    networks:
      - red_trafico

networks:
  red_trafico:
    driver: bridge

volumes:
  datos_postgres:
  grafana_data:
